<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Knowledge Hub</title>
  <link rel="icon" href="assets/book-open.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fafbfa;color:#202722;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
    header{border-bottom:1px solid #dfe5e0;background:#fff}.bar{max-width:1080px;min-height:72px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:650;color:#202722;text-decoration:none}.bar img{width:28px;height:28px}.label{margin-left:auto;font-size:13px;color:#52645b}
    main{max-width:1080px;margin:0 auto;padding:48px 24px 80px}.heading{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid #dfe5e0;padding-bottom:20px}
    h1{margin:0;font-size:26px;font-weight:600}.count{margin:0;color:#53665b;font-size:13px}.empty{min-height:280px;display:grid;place-content:center;text-align:center;color:#647168}
    .empty img{width:44px;height:44px;opacity:.5;margin:0 auto 16px}.empty p{margin:0;font-size:15px}footer{max-width:1080px;margin:0 auto;padding:24px;border-top:1px solid #dfe5e0;color:#647168;font-size:12px}
    @media(max-width:480px){.bar{padding:16px;gap:10px}.brand{font-size:18px}.label{margin-left:0;width:100%;padding-left:38px}main{padding:32px 16px 56px}footer{padding:20px 16px}}
  </style>
</head>
<body>
  <header><div class="bar"><img src="assets/book-open.svg" alt=""><a class="brand" href="index.html">Knowledge Hub</a><span class="label">公开文库</span></div></header>
  <main>
    <div class="heading"><h1>文库</h1><p class="count">0 篇内容</p></div>
    <div class="empty" role="status"><img src="assets/book-open.svg" alt=""><p>暂无已公开内容</p></div>
  </main>
  <footer>Knowledge Hub</footer>
</body>
</html>
